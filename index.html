<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이재명 대통령 임기 계산기</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  background: #f0f2f5;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  padding: 20px 0;
}
.wrap { width: 100%; max-width: 420px; padding: 20px; }
.top-label { font-size: 22px; font-weight: 600; color: #111; margin-bottom: 16px; }

/* ── 메인 카드 ── */
.card {
  background: #2079B4;
  border-radius: 20px;
  padding: 24px 22px 22px;
  position: relative;
  color: #fff;
  overflow: hidden;
}
.card::after {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 180px; height: 180px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
  pointer-events: none;
}
.profile-row { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
.avatar {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.right-info { flex: 1; }
.rank-pill {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(255,255,255,0.18);
  border-radius: 5px; padding: 3px 10px;
  font-size: 11px; color: #fff; font-weight: 500;
  margin-bottom: 5px; letter-spacing: 0.3px;
}
.pname { font-size: 30px; font-weight: 600; color: #fff; letter-spacing: -0.5px; }
.date-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.date-left { display: flex; align-items: center; gap: 8px; }
.date-tag { font-size: 14px; font-weight: 500; color: #fff; }
.date-val { font-size: 14px; color: rgba(255,255,255,0.85); }
.dday { font-size: 16px; font-weight: 600; color: #fff; }
.bar-wrap {
  background: #fff; border-radius: 10px; height: 44px;
  display: flex; align-items: center;
  position: relative; overflow: hidden;
}
.bar-fill-inner {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: #2079B4;
  border-radius: 10px 0 0 10px;
}
.bar-text {
  position: relative; z-index: 2;
  padding-left: 14px; font-size: 20px; font-weight: 600;
  color: #1a1a1a; white-space: nowrap;
}
.stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 14px; }
.stat-box { background: rgba(255,255,255,0.13); border-radius: 10px; padding: 10px 10px 8px; text-align: center; }
.stat-lbl { font-size: 10px; color: rgba(255,255,255,0.65); margin-bottom: 3px; }
.stat-val { font-size: 16px; font-weight: 600; color: #fff; }
.stat-unit { font-size: 11px; color: rgba(255,255,255,0.7); }
.clock-line { margin-top: 10px; font-size: 10px; color: rgba(255,255,255,0.45); text-align: right; }

/* ── 서브 카드 공통 ── */
.sub-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.sub-card {
  border-radius: 16px;
  padding: 14px 14px 12px;
  position: relative;
  overflow: hidden;
}
.sub-card.left  { background: #1a6e47; }
.sub-card.right { background: #7b3fa0; }

.sub-label {
  font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.7);
  margin-bottom: 2px; letter-spacing: 0.2px;
}
.sub-celebrate {
  font-size: 10px; font-weight: 700; color: #ffe066;
  margin-bottom: 2px; letter-spacing: 0.2px;
  animation: pulse 1s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.5; }
}
.sub-end-date {
  font-size: 9px; color: rgba(255,255,255,0.55); margin-bottom: 8px;
}
.sub-bar-wrap {
  background: rgba(255,255,255,0.25); border-radius: 6px; height: 28px;
  position: relative; overflow: hidden;
}
.sub-bar-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  border-radius: 6px 0 0 6px;
}
.sub-card.left  .sub-bar-fill { background: #3ecf8e; }
.sub-card.right .sub-bar-fill { background: #c084fc; }
.sub-bar-text {
  position: relative; z-index: 2;
  padding-left: 8px; font-size: 13px; font-weight: 700;
  color: #fff; white-space: nowrap;
  line-height: 28px;
}
</style>
</head>

<script>
(function(){
  var START = new Date('2025-06-04T00:00:00');
  var END   = new Date('2030-06-03T23:59:59');
  var TOTAL = END - START;

  // 반환점
  var MID_END = new Date('2027-12-03T23:59:59');
  var MID_TOTAL = MID_END - START;

  // N돌 구간 정의 (시작 포함, 끝 포함)
  var DOL_PERIODS = [
    { n:1, start: new Date('2025-06-04T00:00:00'), end: new Date('2026-06-03T23:59:59'), celebrate_end: new Date('2026-06-04T23:59:59') },
    { n:2, start: new Date('2026-06-04T00:00:00'), end: new Date('2027-06-03T23:59:59'), celebrate_end: new Date('2027-06-04T23:59:59') },
    { n:3, start: new Date('2027-06-04T00:00:00'), end: new Date('2028-06-03T23:59:59'), celebrate_end: new Date('2028-06-04T23:59:59') },
    { n:4, start: new Date('2028-06-04T00:00:00'), end: new Date('2029-06-03T23:59:59'), celebrate_end: new Date('2029-06-04T23:59:59') },
  ];

  function pad(n){ return String(n).padStart(2,'0'); }
  function fmtDate(d){ return d.getFullYear()+'.'+ pad(d.getMonth()+1)+'.'+pad(d.getDate()); }

  function setBarPct(fillEl, pctEl, pct) {
    var bw = fillEl.parentElement.offsetWidth;
    fillEl.style.width = Math.min(pct/100*bw, bw) + 'px';
    pctEl.textContent = pct.toFixed(8) + '%';
  }

  function tick(){
    var now = new Date();

    // ── 시계
    document.getElementById('clock').textContent =
      now.getFullYear()+'.'+pad(now.getMonth()+1)+'.'+pad(now.getDate())+'  '+
      pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds())+' 기준';

    // ── 메인 바
    if(now < START){
      var rd = Math.ceil((START-now)/86400000);
      document.getElementById('dday').textContent = 'D-'+rd;
      document.getElementById('pct-text').textContent = '0.00000000%';
      document.getElementById('bar-fill').style.width = '0px';
      document.getElementById('elapsed').textContent = '0';
      document.getElementById('remain').textContent = Math.round(TOTAL/86400000);
    } else if(now >= END){
      document.getElementById('dday').textContent = 'D+0';
      document.getElementById('pct-text').textContent = '100.00000000%';
      document.getElementById('bar-fill').style.width = '100%';
    } else {
      var elapsed = now - START, remaining = END - now;
      var pct = (elapsed/TOTAL)*100;
      document.getElementById('dday').textContent = 'D-'+Math.ceil(remaining/86400000);
      document.getElementById('elapsed').textContent = Math.floor(elapsed/86400000);
      document.getElementById('remain').textContent = Math.ceil(remaining/86400000);
      document.getElementById('pct-text').textContent = pct.toFixed(8)+'%';
      var bw = document.getElementById('bar-fill').parentElement.offsetWidth;
      document.getElementById('bar-fill').style.width = (pct/100*bw)+'px';
    }

    // ── 왼쪽 서브 바 (N돌)
    var period = null;
    for(var i=0; i<DOL_PERIODS.length; i++){
      var p = DOL_PERIODS[i];
      // 현재 진행 중인 돌 찾기
      if(now >= p.start && now <= p.end){ period = p; break; }
      // 축하 공백기 (돌 끝난 후 24시간)
      if(now > p.end && now <= p.celebrate_end){ period = p; break; }
    }

    var lbl = document.getElementById('sub-left-label');
    var endEl = document.getElementById('sub-left-end');
    var lFill = document.getElementById('sub-left-fill');
    var lPct  = document.getElementById('sub-left-pct');

    if(period){
      var isCelebrating = now > period.end && now <= period.celebrate_end;
      if(isCelebrating){
        lbl.className = 'sub-celebrate';
        lbl.textContent = '🎉 국민주권정부 '+period.n+'돌을 축하합니다!';
        endEl.textContent = '';
        lFill.style.width = '100%';
        lPct.textContent = '100.00000000%';
      } else {
        lbl.className = 'sub-label';
        lbl.textContent = '국민주권정부 '+period.n+'돌';
        endEl.textContent = '~ '+fmtDate(period.end);
        var dolTotal = period.end - period.start;
        var dolElapsed = now - period.start;
        var dolPct = Math.min((dolElapsed/dolTotal)*100, 100);
        setBarPct(lFill, lPct, dolPct);
      }
    } else {
      // 4돌 이후
      lbl.className = 'sub-label';
      lbl.textContent = '국민주권정부 임기 종료';
      endEl.textContent = '';
      lFill.style.width = '100%';
      lPct.textContent = '100.00000000%';
    }

    // ── 오른쪽 서브 바 (반환점)
    var rFill = document.getElementById('sub-right-fill');
    var rPct  = document.getElementById('sub-right-pct');
    if(now < START){
      setBarPct(rFill, rPct, 0);
    } else if(now >= MID_END){
      rFill.style.width = '100%';
      rPct.textContent = '100.00000000%';
    } else {
      var midElapsed = now - START;
      var midPct = (midElapsed/MID_TOTAL)*100;
      setBarPct(rFill, rPct, midPct);
    }
  }

  tick(); setInterval(tick, 100);
})();
</script>
</body>
</html>
